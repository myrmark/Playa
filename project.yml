# Xcode project for the Mac and Apple TV apps. Generate it with `xcodegen`
# (brew install xcodegen). ./build-app.sh and ./release.sh do that for the Mac app.
name: Playa
options:
  bundleIdPrefix: com.filipmalmberg
  # Local.xcconfig holds your Apple team ID and is not in the repository.
  disabledValidations: [missingConfigFiles]
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
packages:
  Playa:
    path: .
  MPVKit:
    url: https://github.com/mpvkit/MPVKit.git
    exactVersion: 0.41.0
settingGroups:
  shared:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: false
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  # Named PlayaMac so its scheme doesn't collide with the package's "Playa" executable.
  PlayaMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/Playa
      - path: Support/AppIcon.icns
      - path: Support/container-migration.plist
    dependencies:
      - package: Playa
        product: PlayaCore
      - package: MPVKit
        product: MPVKit
    entitlements:
      path: Support/Playa.entitlements
      properties:
        # The Mac App Store requires the sandbox. Playa only needs to reach the network and
        # to read playlist files the user picks (and re-read them later through a bookmark).
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.files.bookmarks.app-scope: true
        # Sync between the user's devices: iCloud key-value storage and a shared keychain group.
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.filipmalmberg.Playa
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.filipmalmberg.Playa
    settings:
      groups: [shared]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.filipmalmberg.Playa
        PRODUCT_NAME: Playa
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ENABLE_HARDENED_RUNTIME: true
  PlayaTV:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: tvOS
      # Screens that are the same on Apple TV, iPhone and iPad.
      - path: Shared
      - path: Sources/Playa/FollowingStore.swift
        group: Shared
      - path: Sources/Playa/AppLock.swift
        group: Shared
      - path: Sources/Playa/LockScreen.swift
        group: Shared
      # Stores and the player wrapper are shared with the Mac app.
      - path: Sources/Playa/PlaylistStore.swift
        group: Shared
      - path: Sources/Playa/EPGStore.swift
        group: Shared
      - path: Sources/Playa/ResumeStore.swift
        group: Shared
      - path: Sources/Playa/MPVPlayer.swift
        group: Shared
      - path: Sources/Playa/Storage.swift
        group: Shared
      - path: Sources/Playa/Vault.swift
        group: Shared
      - path: Sources/Playa/CloudSync.swift
        group: Shared
    dependencies:
      - sdk: AVKit.framework
      - package: Playa
        product: PlayaCore
      - package: MPVKit
        product: MPVKit
    info:
      path: tvOS/Info.plist
      properties:
        CFBundleDisplayName: Playa
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        # Declares the app's encryption as exempt from export documentation. Playa uses encryption
        # only to fetch playlists and streams over HTTPS and to protect its stored data. Note that
        # HTTPS for streams is done by the TLS libraries bundled with FFmpeg, not by the system.
        ITSAppUsesNonExemptEncryption: false
        # Most IPTV providers serve playlists and streams over plain http.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: tvOS/PlayaTV.entitlements
      properties:
        # The same storage and keychain group as the Mac app, so the two stay in sync.
        # Both apps also share one bundle identifier, which is what makes them a single
        # App Store purchase.
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.filipmalmberg.Playa
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.filipmalmberg.Playa
    settings:
      groups: [shared]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.filipmalmberg.Playa
        PRODUCT_NAME: Playa
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
  PlayaiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iOS
      - path: Shared
      - path: Sources/Playa/FollowingStore.swift
        group: Shared
      - path: Sources/Playa/AppLock.swift
        group: Shared
      - path: Sources/Playa/LockScreen.swift
        group: Shared
      # Stores and the player wrapper are shared with the Mac and Apple TV apps.
      - path: Sources/Playa/PlaylistStore.swift
        group: Shared
      - path: Sources/Playa/EPGStore.swift
        group: Shared
      - path: Sources/Playa/ResumeStore.swift
        group: Shared
      - path: Sources/Playa/MPVPlayer.swift
        group: Shared
      - path: Sources/Playa/Storage.swift
        group: Shared
      - path: Sources/Playa/Vault.swift
        group: Shared
      - path: Sources/Playa/CloudSync.swift
        group: Shared
    dependencies:
      - package: Playa
        product: PlayaCore
      - package: MPVKit
        product: MPVKit
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Playa
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Sound carries on when the app is left, if chosen in Settings.
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Most IPTV providers serve playlists and streams over plain http.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: iOS/PlayaiOS.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.filipmalmberg.Playa
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.filipmalmberg.Playa
    settings:
      groups: [shared]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.filipmalmberg.Playa
        PRODUCT_NAME: Playa
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
