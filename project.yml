# Xcode project for the Apple TV app. Generate it with `xcodegen` (brew install xcodegen),
# then open PlayaTV.xcodeproj. The Mac app is built with ./build-app.sh and doesn't use this.
name: PlayaTV
options:
  bundleIdPrefix: com.filipmalmberg
  # Local.xcconfig holds your Apple team ID and is not in the repository.
  disabledValidations: [missingConfigFiles]
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
  deploymentTarget:
    tvOS: "17.0"
packages:
  Playa:
    path: .
  MPVKit:
    url: https://github.com/mpvkit/MPVKit.git
    exactVersion: 0.41.0
targets:
  PlayaTV:
    type: application
    platform: tvOS
    sources:
      - path: tvOS
      # Stores and the player wrapper are shared with the Mac app.
      - path: Sources/Playa/PlaylistStore.swift
        group: Shared
      - path: Sources/Playa/EPGStore.swift
        group: Shared
      - path: Sources/Playa/ResumeStore.swift
        group: Shared
      - path: Sources/Playa/MPVPlayer.swift
        group: Shared
      - path: Sources/Playa/Storage.swift
        group: Shared
      - path: Sources/Playa/Vault.swift
        group: Shared
    dependencies:
      - package: Playa
        product: PlayaCore
      - package: MPVKit
        product: MPVKit
    info:
      path: tvOS/Info.plist
      properties:
        CFBundleDisplayName: Playa
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        # Most IPTV providers serve playlists and streams over plain http.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.filipmalmberg.Playa.tv
        PRODUCT_NAME: Playa
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: false
